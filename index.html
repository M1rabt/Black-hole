<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05040a">
<meta name="description" content="An interactive visual black hole simulator by mrabt.">
<title>Black Hole Simulator — mrabt</title>
<style>
:root{color-scheme:dark;--ink:#f7f3ff;--muted:#a9a3bb;--line:#ffffff1c;--panel:#100d1bdc;--cyan:#9cecff;--gold:#ffb75e;--violet:#ae8cff}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:#05040a;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}#universe{position:fixed;inset:0;width:100%;height:100%;display:block}.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 20%,#05040a1c 56%,#05040acc 100%)}.grain{position:fixed;inset:0;opacity:.13;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E");mix-blend-mode:screen}.topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:25px 32px;z-index:2}.brand{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}.brand-mark{width:30px;height:30px;border-radius:50%;border:1px solid #9cecff70;display:grid;place-items:center;box-shadow:0 0 22px #6ecfff36}.brand-mark:after{content:"";width:12px;height:12px;border-radius:50%;background:#030307;box-shadow:0 0 0 2px #df9dff,0 0 14px #ffad55}.status{display:flex;align-items:center;gap:9px;color:#c9c2d8;font:10px ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase}.dot{width:6px;height:6px;border-radius:50%;background:#9cecff;box-shadow:0 0 10px #9cecff;animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.35;box-shadow:0 0 2px #9cecff}}.title{position:fixed;left:6vw;top:27%;z-index:1;pointer-events:none}.kicker{font:10px ui-monospace,monospace;color:var(--cyan);letter-spacing:.25em;text-transform:uppercase}.title h1{font-size:clamp(35px,5.6vw,78px);letter-spacing:-.07em;line-height:.92;margin:15px 0 14px;font-weight:570}.title h1 span{display:block;color:#b8aecb;font-weight:350}.title p{margin:0;color:#a9a3bb;font-size:13px;letter-spacing:.02em}.readout{position:fixed;right:36px;top:34%;z-index:1;width:155px;text-align:right;pointer-events:none}.readout .label{font:9px ui-monospace,monospace;color:#a9a3bb;letter-spacing:.18em}.readout strong{display:block;font-size:25px;font-weight:450;letter-spacing:-.04em;margin:4px 0}.readout small{color:#8d879e;font-size:10px}.panel{position:fixed;z-index:3;left:50%;bottom:24px;transform:translateX(-50%);width:min(780px,calc(100% - 32px));padding:17px 20px 15px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#171323ed,#0b0a12eb);box-shadow:0 18px 70px #0009,inset 0 1px #ffffff0c;backdrop-filter:blur(22px)}.panel-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel-title{font:10px ui-monospace,monospace;letter-spacing:.18em;color:#d5cce5;text-transform:uppercase}.controls{display:grid;grid-template-columns:1fr 1fr auto;gap:22px;align-items:center}.slider label{display:flex;justify-content:space-between;gap:8px;color:#aaa3b8;font-size:10px;margin-bottom:7px}.slider output{color:#f5efff;font:11px ui-monospace,monospace}input[type=range]{appearance:none;width:100%;height:2px;border-radius:3px;background:linear-gradient(90deg,#be8fff,#ffb75e);outline:none;display:block}input[type=range]::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid #c69cff;box-shadow:0 0 12px #bf8cffaa;cursor:pointer}input[type=range]::-moz-range-thumb{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid #c69cff;box-shadow:0 0 12px #bf8cffaa;cursor:pointer}.buttons{display:flex;gap:8px}.icon-btn{border:1px solid var(--line);width:38px;height:36px;border-radius:10px;background:#ffffff08;color:#eee7f8;cursor:pointer;display:grid;place-items:center;transition:.2s}.icon-btn:hover{border-color:#bda0e9;background:#ffffff14;transform:translateY(-1px)}.icon-btn svg{width:15px;height:15px;fill:currentColor}.hint{display:flex;justify-content:space-between;color:#777186;font:9px ui-monospace,monospace;letter-spacing:.07em;margin-top:13px}.creator{color:#c4bbd2}.creator b{color:#f6efff;font-weight:600;letter-spacing:.1em}.mobile-title{display:none}
@media(max-width:650px){.topbar{padding:18px}.status{font-size:8px}.title{left:22px;top:17%;}.title h1{font-size:44px}.title p{font-size:11px}.readout{right:22px;top:auto;bottom:190px;width:auto}.readout strong{font-size:19px}.readout .label{font-size:8px}.panel{bottom:12px;padding:15px 14px 12px;border-radius:15px}.controls{grid-template-columns:1fr 1fr;gap:14px 18px}.buttons{grid-column:1/-1;justify-content:flex-end}.icon-btn{width:40px}.hint{font-size:8px}.hint span:first-child{max-width:55%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="universe" aria-label="Animated visualization of a black hole and its glowing accretion disk"></canvas>
<div class="vignette"></div><div class="grain"></div>
<header class="topbar"><div class="brand"><span class="brand-mark"></span><span>Singularity / 01</span></div><div class="status"><i class="dot"></i><span id="status">Simulation running</span></div></header>
<main>
<section class="title"><div class="kicker">Interactive space study</div><h1>Beyond the<span>event horizon.</span></h1><p>A visual black hole simulator</p></section>
<aside class="readout"><div class="label">ESTIMATED MASS</div><strong id="mass-readout">8.4 M☉</strong><small>solar masses</small></aside>
<section class="panel" aria-label="Black hole simulation controls"><div class="panel-top"><div class="panel-title">Simulation controls</div></div><div class="controls">
<div class="slider"><label for="mass"><span>Black hole mass</span><output id="mass-value">8.4 M☉</output></label><input id="mass" type="range" min="2" max="20" value="8.4" step=".1"></div>
<div class="slider"><label for="spin"><span>Disk rotation</span><output id="spin-value">72%</output></label><input id="spin" type="range" min="10" max="100" value="72" step="1"></div>
<div class="buttons">
<button class="icon-btn" id="pause" type="button" aria-label="Pause simulation" title="Pause simulation"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm7 0h4v14h-4z"/></svg></button>
<button class="icon-btn" id="reset" type="button" aria-label="Reset simulation" title="Reset simulation"><svg viewBox="0 0 24 24"><path d="M12 5V1L6 7l6 6V9a6 6 0 1 1-5.65 8h-2.1A8 8 0 1 0 12 5"/></svg></button>
</div></div><div class="hint"><span>Adjust mass and rotation to shape the system</span><span class="creator">CREATED BY <b>mrabt</b></span></div></section>
</main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('universe'),ctx=canvas.getContext('2d',{alpha:false});
const mass=document.getElementById('mass'),spin=document.getElementById('spin');
const massValue=document.getElementById('mass-value'),massReadout=document.getElementById('mass-readout'),spinValue=document.getElementById('spin-value');
const pause=document.getElementById('pause'),status=document.getElementById('status');
let w=0,h=0,dpr=1,time=0,running=true,raf=0,stars=[],particles=[],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.floor(w*h/1900)},()=>({x:Math.random()*w,y:Math.random()*h,r:rand(.25,1.25),a:rand(.18,.8),phase:rand(0,6.28),blue:Math.random()>.72}));particles=Array.from({length:380},()=>({angle:rand(0,6.28),radius:rand(1.35,3.25),size:rand(.35,1.8),speed:rand(.0008,.003),phase:rand(0,6.28),band:Math.random()}));}
function center(){return{x:w*(w<650?.51:.56),y:h*(w<650?.46:.49)}}
function draw(){ctx.fillStyle='#05040a';ctx.fillRect(0,0,w,h);const c=center(),m=Number(mass.value),s=Number(spin.value)/100,R=clamp(Math.min(w,h)*(.07+m*.0028),34,118),disk=R*(2.8+s*.72),rotation=time*(.003+s*.005);
for(const star of stars){const tw=.55+.45*Math.sin(time*.025+star.phase);ctx.fillStyle=star.blue?'rgba(170,205,255,'+(star.a*tw)+')':'rgba(239,230,255,'+(star.a*tw)+')';ctx.beginPath();ctx.arc(star.x,star.y,star.r,0,6.283);ctx.fill()}
let halo=ctx.createRadialGradient(c.x,c.y,R*.65,c.x,c.y,disk*2.4);halo.addColorStop(0,'#08050e');halo.addColorStop(.27,'rgba(173,88,255,.08)');halo.addColorStop(.42,'rgba(255,147,73,.13)');halo.addColorStop(.58,'rgba(92,169,255,.06)');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.fillRect(c.x-disk*2.5,c.y-disk*2.5,disk*5,disk*5);
ctx.save();ctx.translate(c.x,c.y);ctx.rotate(-.16+Math.sin(time*.002)*.015);
for(let band=0;band<7;band++){const r=R*(1.25+band*.235),ry=r*(.20+band*.012);ctx.beginPath();ctx.ellipse(0,0,r,ry,0,0,Math.PI*2);const grad=ctx.createLinearGradient(-r,0,r,0);grad.addColorStop(0,'rgba(83,147,255,'+(.18+band*.025)+')');grad.addColorStop(.24,'rgba(183,120,255,'+(.36+band*.035)+')');grad.addColorStop(.53,'rgba(255,231,176,'+(.78-band*.035)+')');grad.addColorStop(.73,'rgba(255,139,66,'+(.55-band*.035)+')');grad.addColorStop(1,'rgba(106,115,255,'+(.15+band*.02)+')');ctx.strokeStyle=grad;ctx.lineWidth=R*(.035+band*.003);ctx.shadowColor=band%2?'#ff9b56':'#9c78ff';ctx.shadowBlur=13+band*2;ctx.stroke()}
ctx.shadowBlur=0;
for(const p of particles){const ang=p.angle+rotation*(.36+p.radius*.25),rr=R*p.radius;const x=Math.cos(ang)*rr,y=Math.sin(ang)*rr*.23;const front=Math.sin(ang)>0;ctx.globalAlpha=(front?.42:.7)*(.5+.5*Math.sin(time*.03+p.phase));ctx.fillStyle=p.band>.68?'#b9c8ff':p.band>.37?'#ffd99b':'#ff9f61';ctx.beginPath();ctx.arc(x,y,p.size*(.6+s*.6),0,6.283);ctx.fill()}ctx.globalAlpha=1;ctx.restore();
const lens=ctx.createRadialGradient(c.x,c.y,R*.82,c.x,c.y,R*1.2);lens.addColorStop(0,'rgba(0,0,0,0)');lens.addColorStop(.72,'rgba(196,136,255,.03)');lens.addColorStop(.9,'rgba(255,205,143,.94)');lens.addColorStop(1,'rgba(255,152,74,.08)');ctx.fillStyle=lens;ctx.beginPath();ctx.arc(c.x,c.y,R*1.2,0,6.283);ctx.fill();
const hole=ctx.createRadialGradient(c.x-R*.2,c.y-R*.24,1,c.x,c.y,R);hole.addColorStop(0,'#000');hole.addColorStop(.72,'#010106');hole.addColorStop(.94,'#03020a');hole.addColorStop(1,'#17101f');ctx.fillStyle=hole;ctx.beginPath();ctx.arc(c.x,c.y,R,0,6.283);ctx.fill();
// A lensed upper arc gives the disk a wraparound appearance.
ctx.save();ctx.translate(c.x,c.y);ctx.rotate(-.16);ctx.beginPath();ctx.ellipse(0,0,R*1.28,R*.25,0,Math.PI*1.02,Math.PI*1.98);ctx.strokeStyle='rgba(255,223,172,.83)';ctx.lineWidth=Math.max(2,R*.055);ctx.shadowColor='#ffb66c';ctx.shadowBlur=18;ctx.stroke();ctx.restore();
if(running){time++;raf=requestAnimationFrame(draw)}}
function render(){cancelAnimationFrame(raf);draw()}
function update(){massValue.value=mass.value+' M☉';massReadout.textContent=mass.value+' M☉';spinValue.value=spin.value+'%';render()}
mass.addEventListener('input',update);spin.addEventListener('input',update);
pause.addEventListener('click',()=>{running=!running;status.textContent=running?'Simulation running':'Simulation paused';pause.setAttribute('aria-label',running?'Pause simulation':'Resume simulation');pause.title=running?'Pause simulation':'Resume simulation';pause.innerHTML=running?'<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm7 0h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="m7 4 13 8-13 8z"/></svg>';if(running)render();else cancelAnimationFrame(raf)});
document.getElementById('reset').addEventListener('click',()=>{mass.value='8.4';spin.value='72';running=true;status.textContent='Simulation running';pause.setAttribute('aria-label','Pause simulation');pause.title='Pause simulation';pause.innerHTML='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zm7 0h4v14h-4z"/></svg>';update()});
addEventListener('resize',()=>{resize();render()},{passive:true});
resize();if(reduced)running=false;update();
})();
</script>
</body>
</html>
